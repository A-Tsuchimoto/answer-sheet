<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>回答記録</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #111827;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      padding: 16px 16px 14px;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      color: #9ca3af;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
    }

    .grid {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      flex: 1;
      display: flex;
      align-items: center;
      background: #1f2937;
      border-radius: 16px;
      padding: 0 18px;
      gap: 10px;
    }

    .label-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 38px;
      user-select: none;
      gap: 2px;
    }

    .kana {
      font-size: 18px;
      font-weight: 700;
      color: #d1d5db;
    }

    .num {
      font-size: 11px;
      color: #6b7280;
    }

    .btns {
      flex: 1;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #374151;
      background: #111827;
      font-size: 24px;
      color: #6b7280;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    .btn:active { transform: scale(0.86); }

    .btn-maru.on  { background: #14532d; border-color: #22c55e; color: #86efac; }
    .btn-batsu.on { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }
    .btn-hante.on { background: #78350f; border-color: #f59e0b; color: #fcd34d; }
    .btn-star.on  { background: #713f12; border-color: #eab308; color: #fde047; }

    .footer {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid #374151;
      border-radius: 20px;
      padding: 9px 32px;
      color: #6b7280;
      font-size: 13px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    .btn-reset:active { opacity: 0.6; }
  </style>
</head>
<body>
  <div class="app">
    <h1>弁理士試験 回答記録</h1>
    <div class="grid" id="grid"></div>
    <div class="footer">
      <button class="btn-reset" id="resetBtn">CLEAR</button>
    </div>
  </div>

  <script>
    const LABELS = ['イ', 'ロ', 'ハ', 'ニ', 'ホ'];
    const KEY = 'benpri_answers';

    let state = LABELS.map(() => ({ answer: null, star: false }));

    function load() {
      try {
        const s = localStorage.getItem(KEY);
        if (s) state = JSON.parse(s);
      } catch (_) {}
    }

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {}
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      LABELS.forEach((label, i) => {
        const { answer, star } = state[i];
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
          <div class="label-col">
            <span class="kana">(${label})</span>
            <span class="num">${i + 1}</span>
          </div>
          <div class="btns">
            <button class="btn btn-maru ${answer === 'maru'  ? 'on' : ''}" data-i="${i}" data-v="maru">○</button>
            <button class="btn btn-hante ${answer === 'hante' ? 'on' : ''}" data-i="${i}" data-v="hante">？</button>
            <button class="btn btn-batsu ${answer === 'batsu' ? 'on' : ''}" data-i="${i}" data-v="batsu">×</button>
            <button class="btn btn-star ${star ? 'on' : ''}" data-i="${i}" data-v="star">★</button>
          </div>
        `;
        grid.appendChild(row);
      });
    }

    document.getElementById('grid').addEventListener('click', e => {
      const btn = e.target.closest('[data-v]');
      if (!btn) return;
      const i = +btn.dataset.i;
      const v = btn.dataset.v;
      if (v === 'star') {
        state[i].star = !state[i].star;
      } else {
        state[i].answer = state[i].answer === v ? null : v;
      }
      save();
      render();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      state = LABELS.map(() => ({ answer: null, star: false }));
      save();
      render();
    });

    load();
    render();
  </script>
</body>
</html>
